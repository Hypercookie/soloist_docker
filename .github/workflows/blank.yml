name: Build and Sign Docker Image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,15 * *"

env:
  IMAGE: ghcr.io/hypercookie/soloist_docker

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            tag: amd64
          - platform: linux/arm64
            tag: arm64
          - platform: linux/arm/v7
            tag: armv7

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE }}:${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Get image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "${{ env.IMAGE }}:${{ matrix.tag }}" \
            | awk '/^Digest:/ {print $2; exit}')

          if [ -z "$DIGEST" ]; then
            echo "Could not find image digest"
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Image digest: $DIGEST"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        run: |
          cosign sign --yes \
            "${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}"

  manifest:
    name: Create multi-platform manifest
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-platform manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/hypercookie/soloist_docker:latest \
            ghcr.io/hypercookie/soloist_docker:amd64 \
            ghcr.io/hypercookie/soloist_docker:arm64 \
            ghcr.io/hypercookie/soloist_docker:armv7

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign multi-platform image
        run: |
          cosign sign --yes ghcr.io/hypercookie/soloist_docker:latest
